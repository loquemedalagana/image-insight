version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000' # 호스트와 컨테이너의 포트 매핑
    volumes:
      - .:/usr/src/app # 로컬 디렉토리와 컨테이너 디렉토리 동기화
      - /usr/src/app/node_modules # node_modules를 볼륨에 마운트하지 않음
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true
