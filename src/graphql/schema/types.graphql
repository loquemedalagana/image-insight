# Custom scalar for flexible JSON options (옵션 전달을 위해)
scalar JSON

enum FileFormat {
  JPEG
  CR3
}

enum PreprocessingStatus {
  PENDING
  COMPLETED
  FAILED
}

type Category {
  id: ID!
  name: String!
}

type GPS {
  latitude: Float
  longitude: Float
}

# 업데이트된 EXIF 데이터 타입: 캘리브레이션 및 보정을 위한 추가 필드 포함
type ExifData {
  make: String
  model: String
  iso: Int
  exposureTime: Float # 노출 시간 (초 단위)
  fNumber: Float # 조리개 값
  focalLength: Float # 초점 거리 (mm 단위)
  dateTimeOriginal: String
  gps: GPS

  # 이미지 및 센서 관련 정보
  exifImageWidth: Int # 예: 6000
  exifImageHeight: Int # 예: 4000
  orientation: String
  xResolution: Float
  yResolution: Float
  resolutionUnit: String

  # 초점면 해상도 정보 (센서의 물리적 해상도 관련)
  focalPlaneXResolution: Float
  focalPlaneYResolution: Float
  focalPlaneResolutionUnit: String

  # 색상 보정을 위한 필드
  whitePoint: [Float!]! # 예: [0.313, 0.329]
  primaryChromaticities: [Float!]! # 예: [0.64, 0.33, 0.21, 0.71, 0.15, 0.06]
  gamma: Float # 예: 2.2
  # 초점 및 거리 정보
  subjectDistance: Float
  focusDistance: Float

  # 렌즈 관련 정보
  lensModel: String
}

type Metadata {
  id: ID!
  fileName: String!
  categories: [Category!]! # ✅ 다중 카테고리 지원
  imageUrl: String!
  width: Int
  height: Int
  format: String
  size: Int
  exif: ExifData
}

# -------------------------------
# NeRF 이미지 전처리를 위한 추가 타입
# -------------------------------

# 카메라 내부 파라미터를 표현하는 타입 (추가 옵션)
type CameraIntrinsics {
  focalLength: Float! # 단위: mm 또는 픽셀 (설정에 따라)
  principalPoint: [Float!]! # [cx, cy]
  sensorWidth: Float # 센서 폭 (옵션)
  sensorHeight: Float # 센서 높이 (옵션)
}

# 카메라 외부 파라미터(위치 및 방향)를 표현하는 타입
type CameraExtrinsics {
  position: [Float!]! # [x, y, z] 좌표
  rotation: [Float!]! # 회전값 (예: Euler 각도 또는 quaternion)
}

# NeRF 학습에 사용될 전처리 이미지 데이터 타입 (메타데이터와 카메라 파라미터 포함)
type NeRFImage {
  id: ID!
  metadata: Metadata! # 원본 이미지 메타데이터
  # 내·외부 파라미터는 2차원 배열(행렬)로 표현 (또는 별도 타입 사용 가능)
  intrinsics: [[Float!]!]! # 예: 3x3 내적 행렬 (혹은 CameraIntrinsics 타입으로 변환 가능)
  extrinsics: [[Float!]!]! # 예: 4x4 외적(프로젝션) 행렬
  preprocessingStatus: PreprocessingStatus! # enum으로 정의: 전처리 상태 ("pending", "completed", "failed" 등)
  processedAt: String # 전처리 완료 시간 (ISO8601 형식)
}

# 전처리 작업에 필요한 입력값 (여러 이미지 선택 및 옵션 전달 등)
input NeRFPreprocessingInput {
  imageIds: [ID!]!
  algorithm: String # 전처리에 사용할 알고리즘 명 (옵션)
  options: JSON # 알고리즘별 추가 옵션 (custom JSON scalar)
}

input MetadataSearchCondition {
  categoryName: String
  fileName: String
  fileFormat: FileFormat
}

type Query {
  metadata(searchCondition: MetadataSearchCondition!): [Metadata!]!
  metadataById(id: ID!): Metadata # 특정 id로 데이터 조회
  getCategoryById(id: ID!): Category
  getCategoryList: [Category!]! # ✅ 중복 제거된 카테고리 목록
  # 추가: NeRF 전처리용 이미지 데이터 조회
  nerfImages: [NeRFImage!]!
  nerfImageById(id: ID!): NeRFImage
}

type Mutation {
  deleteMetadataById(id: ID!): Boolean # 특정 id로 데이터 삭제
  # 새로운 메타데이터를 추가하는 Mutation (다중 카테고리 지원)
  addMetadata(filePath: String!, categoryIds: [ID!]!): Metadata
  addCategory(name: String!): Category # 새로운 카테고리 추가 Mutation
  # NeRF 전처리 관련 Mutation 예시
  updateNerfImage(
    id: ID!
    intrinsics: [[Float!]!]!
    extrinsics: [[Float!]!]!
    preprocessingStatus: String
  ): NeRFImage

  startNerfPreprocessing(input: NeRFPreprocessingInput!): [NeRFImage!]!
}
