query GetMetadataById($id: ID!) {
  metadataById(id: $id) {
    id
    fileName
    imageUrl
    category
    exif {
      make
      model
    }
  }
}

query GetMetadata($dummy: Boolean!) {
  metadata(dummy: $dummy) {
    id
    fileName
    category
    width
    height
    format
    size
    imageUrl
    exif {
      make
      model
    }
  }
}
