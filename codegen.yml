overwrite: true
schema: "src/graphql/schema/index.ts" # GraphQL 스키마 경로
documents: "src/graphql/documents/**/*.graphql" # GraphQL 쿼리 문서 경로
generates:
  src/__generated__/:
    preset: near-operation-file
    presetConfig:
      baseTypesPath: graphql.ts # 스키마 기반 타입 정의 경로
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-query
    config:
      fetcher: "graphql-request"
